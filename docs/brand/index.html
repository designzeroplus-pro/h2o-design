<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>H2O Brand Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#EDEDED;--card:#FFFFFF;--ink:#2B2B2B;--sub:#5E5E5E;--mute:#8C8C8C;--line:#E2E2E2;--lime:#C5F04F;--dark:#1F1F1F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree','Noto Sans KR',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lime);display:inline-block}
.lang{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px}
.lang button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--sub);padding:7px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--dark);color:#fff}
.card{background:var(--card);border-radius:28px;padding:28px 24px;margin-bottom:14px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;letter-spacing:-.02em;margin:0 0 14px;font-weight:700}
h1 .dot{width:11px;height:11px;margin-left:4px;vertical-align:baseline}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 18px;display:flex;gap:10px;align-items:center}
h2 .num{color:var(--ink)}
p{margin:0 0 10px}
.lead{font-size:17px;color:var(--sub)}
.meta{font-size:13px;color:var(--mute);margin-top:16px}
.q{margin-bottom:26px}
.q:last-child{margin-bottom:0}
.ql{display:block;font-weight:700;font-size:15.5px;margin-bottom:4px}
.qh{font-size:13.5px;color:var(--sub);margin:0 0 10px}
.req{color:#C0392B;margin-left:2px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.choices.wide{grid-template-columns:1fr}
.choice{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.choice input{accent-color:var(--dark);width:18px;height:18px;margin:0;flex-shrink:0}
.choice:has(input:checked){border-color:var(--dark);background:#F7FBEA}
.choice small{display:block;font-weight:400;color:var(--sub);font-size:12.5px}
input[type=text],textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--dark)}
textarea{min-height:92px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:15px 24px;cursor:pointer}
.btn.primary{background:var(--dark);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink)}
.status{font-size:13.5px;color:var(--sub);margin:12px 0 0;min-height:20px}
.err{color:#C0392B}
footer{text-align:center;font-size:13px;color:var(--mute);margin-top:24px}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">H2O<span class="dot"></span></div>
    <div class="lang" role="group" aria-label="Langue / 언어">
      <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </header>

  <section class="card">
    <h1><span data-t="title"></span><span class="dot"></span></h1>
    <p class="lead" data-t="lead"></p>
    <p class="meta" data-t="meta"></p>
  </section>

  <form id="f" novalidate>
    <div id="sections"></div>
    <section class="card">
      <div class="actions">
        <button class="btn primary" type="submit" data-t="send"></button>
        <button class="btn ghost" type="button" id="copy" data-t="copy"></button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </form>

  <footer>YoungDo Lee · <a href="mailto:youngdonet@gmail.com">youngdonet@gmail.com</a></footer>
</div>

<script>
const TO = 'youngdonet@gmail.com';

// Question structure is shared; wording lives per language in T
const S = [
  {sec: 'secA', qs: [
    {id: 'pitch', type: 'text', req: true},
    {id: 'target', type: 'area'},
    {id: 'mood', type: 'check', max: 3, opts: ['clean', 'playful', 'calm', 'chic', 'friendly', 'trust', 'eco', 'witty']},
    {id: 'avoid', type: 'text'}
  ]},
  {sec: 'secB', qs: [
    {id: 'name', type: 'radio', opts: ['fixed', 'flex', 'review']},
    {id: 'logo', type: 'radio', wide: true, opts: ['word', 'combo', 'mascot', 'open']}
  ]},
  {sec: 'secC', qs: [
    {id: 'color', type: 'area'},
    {id: 'mascot', type: 'radio', wide: true, opts: ['none', 'icon', 'ui', 'toon']}
  ]},
  {sec: 'secD', qs: [
    {id: 'market', type: 'check', opts: ['kr', 'fr', 'eu', 'global']},
    {id: 'refs', type: 'area'},
    {id: 'msg', type: 'area'}
  ]}
];

const T = {
ko: {
  title: 'H2O 브랜드 질문지',
  lead: '안녕하세요, H2O 앱 디자이너 YoungDo Lee입니다. 로고·컬러·마스코트 방향을 잡기 위해 팀의 생각을 듣고 싶습니다. 정답은 없으니 떠오르는 대로 적어 주세요. 모르는 항목은 비워 두셔도 됩니다.',
  meta: '약 10분 · 답변은 이메일로 전달됩니다 · 받은 답변으로 2주 차에 로고 시안 두 가지를 보여드립니다',
  secA: '브랜드 성격', secB: '이름과 로고', secC: '컬러와 마스코트', secD: '시장과 참고 자료',
  pitch: ['H2O를 한 문장으로 소개한다면?', '예: 물을 틀지 않고도 화장실 소리를 가려 주는 에티켓 앱'],
  target: ['가장 먼저 쓸 사람은 누구인가요?', '나이, 상황, 쓰는 장소 등을 자유롭게'],
  mood: ['사람들이 H2O에서 느꼈으면 하는 인상을 최대 3개 골라 주세요.', ''],
  avoid: ['절대 이렇게 보이면 안 된다, 하는 느낌이 있나요?', '예: 화장실이 연상되는 직접적인 표현, 유치함'],
  name: ['‘H2O’라는 이름은 확정인가요?', '같은 이름의 상표가 많아 확인이 필요합니다'],
  logo: ['어떤 로고를 원하시나요?', ''],
  color: ['꼭 쓰고 싶거나 피하고 싶은 색이 있나요?', '현재 시안은 라임과 차콜을 쓰고 있습니다'],
  mascot: ['물방울 마스코트를 어디까지 쓸까요?', ''],
  market: ['처음 출시할 시장은 어디인가요?', '여러 개 선택할 수 있습니다'],
  refs: ['좋아하는 앱이나 브랜드가 있다면 알려 주세요.', '링크와 함께 어떤 점이 좋은지 한 줄씩'],
  msg: ['덧붙일 말씀 (선택)', '일정, 담당자, 이미 정해진 것 등'],
  o: {
    clean: '깨끗한', playful: '유쾌한', calm: '차분한', chic: '세련된', friendly: '친근한', trust: '믿음직한', eco: '친환경적인', witty: '재치 있는',
    fixed: '확정', flex: '바꿀 수 있음', review: '검토 중',
    word: ['글자 로고', 'H2O 글자만으로 구성'], combo: ['심볼 + 글자', '물방울 등 심볼과 글자 조합'], mascot: ['마스코트 중심', '캐릭터가 로고 역할'], open: ['디자이너에게 맡김', '시안을 보고 결정'],
    none: ['쓰지 않음', ''], icon: ['로고·앱 아이콘에만', ''], ui: ['앱 화면 곳곳에', '빈 화면, 로딩, 절약 캡슐의 표정과 움직임'], toon: ['컷툰까지', '피드의 위생 상황극 컷툰 포함'],
    kr: '한국', fr: '프랑스', eu: '그 외 유럽', global: '전 세계 동시'
  },
  send: '이메일로 보내기', copy: '답변 복사', req: '* 표시 질문에 답해 주세요.', max: '최대 3개까지 고를 수 있습니다.',
  sent: '메일 앱이 답변과 함께 열립니다. 열리지 않으면 답변을 복사해 ' + TO + '로 보내 주세요.',
  copied: '답변을 복사했습니다. ' + TO + '로 보내 주세요.',
  subject: 'H2O – 브랜드 질문지 답변'
},
fr: {
  title: 'Questionnaire de marque H2O',
  lead: "Bonjour, je suis YoungDo Lee, le designer de l'app H2O. Pour orienter le logo, les couleurs et la mascotte, j'aimerais connaître l'avis de l'équipe. Il n'y a pas de bonne réponse : écrivez ce qui vous vient. Vous pouvez laisser vide ce que vous ne savez pas.",
  meta: 'Environ 10 minutes · Vos réponses me sont envoyées par e-mail · Je présenterai deux pistes de logo en semaine 2',
  secA: 'Personnalité de la marque', secB: 'Nom et logo', secC: 'Couleurs et mascotte', secD: 'Marché et références',
  pitch: ['Comment présenteriez-vous H2O en une phrase ?', "Ex. : l'app qui couvre les bruits aux toilettes sans faire couler l'eau"],
  target: ["Qui l'utilisera en premier ?", 'Âge, situations, lieux… librement'],
  mood: ["Choisissez jusqu'à 3 impressions que H2O doit laisser.", ''],
  avoid: ["Y a-t-il une image à éviter absolument ?", 'Ex. : évocation trop directe des toilettes, côté enfantin'],
  name: ['Le nom « H2O » est-il définitif ?', 'Beaucoup de marques portent ce nom : il faudra vérifier'],
  logo: ['Quel type de logo souhaitez-vous ?', ''],
  color: ['Des couleurs à utiliser ou à éviter ?', 'La maquette actuelle utilise un vert citron et un anthracite'],
  mascot: ["Jusqu'où utiliser la mascotte goutte d'eau ?", ''],
  market: ['Sur quel marché lancer en premier ?', 'Plusieurs choix possibles'],
  refs: ['Des apps ou marques que vous aimez ?', 'Un lien et ce qui vous plaît, une ligne chacun'],
  msg: ['Un mot à ajouter ? (facultatif)', 'Calendrier, interlocuteurs, éléments déjà décidés…'],
  o: {
    clean: 'Propre', playful: 'Joyeux', calm: 'Apaisant', chic: 'Élégant', friendly: 'Accessible', trust: 'Fiable', eco: 'Écologique', witty: 'Malicieux',
    fixed: 'Définitif', flex: 'Modifiable', review: "À l'étude",
    word: ['Logotype', 'Les lettres H2O seules'], combo: ['Symbole + texte', 'Une goutte ou un symbole avec le nom'], mascot: ['Mascotte au centre', 'Le personnage sert de logo'], open: ['Au choix du designer', 'Décision sur maquettes'],
    none: ['Pas de mascotte', ''], icon: ["Logo et icône d'app seulement", ''], ui: ["Partout dans l'app", "États vides, chargement, expressions dans la capsule d'économie"], toon: ["Jusqu'aux strips", "Y compris les mini-BD d'hygiène du fil"],
    kr: 'Corée', fr: 'France', eu: 'Autres pays européens', global: 'Monde entier'
  },
  send: 'Envoyer par e-mail', copy: 'Copier mes réponses', req: 'Merci de répondre aux questions marquées *.', max: "Trois choix au maximum.",
  sent: "Votre messagerie s'ouvre avec les réponses. Si rien ne s'ouvre, copiez-les et envoyez-les à " + TO + '.',
  copied: 'Réponses copiées. Collez-les dans un e-mail à ' + TO + '.',
  subject: 'H2O – Questionnaire de marque : réponses'
}};

let lang = 'ko';
try { const s = localStorage.getItem('h2o-lang'); if (T[s]) lang = s; } catch (e) {}
const f = document.getElementById('f');
const status = document.getElementById('status');
const KEY = 'h2o-brand-draft';

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function optLabel(d, k) { const v = d.o[k]; return Array.isArray(v) ? v : [v, '']; }

function build() {
  const d = T[lang];
  let n = 0;
  document.getElementById('sections').innerHTML = S.map((sec, i) => {
    const qs = sec.qs.map(q => {
      n++;
      const [label, hint] = d[q.id];
      const head = '<span class="ql">' + n + '. ' + esc(label) + (q.req ? '<span class="req">*</span>' : '') + '</span>' + (hint ? '<p class="qh">' + esc(hint) + '</p>' : '<p class="qh"></p>');
      if (q.type === 'text') return '<div class="q"><label for="' + q.id + '">' + head + '</label><input type="text" id="' + q.id + '" name="' + q.id + '"></div>';
      if (q.type === 'area') return '<div class="q"><label for="' + q.id + '">' + head + '</label><textarea id="' + q.id + '" name="' + q.id + '"></textarea></div>';
      const t = q.type === 'check' ? 'checkbox' : 'radio';
      const opts = q.opts.map(k => {
        const [l, s] = optLabel(d, k);
        return '<label class="choice"><input type="' + t + '" name="' + q.id + '" value="' + k + '"><span>' + esc(l) + (s ? '<small>' + esc(s) + '</small>' : '') + '</span></label>';
      }).join('');
      return '<fieldset class="q" style="border:0;padding:0;margin:0 0 26px"><legend style="padding:0">' + head + '</legend><div class="choices' + (q.wide ? ' wide' : '') + '">' + opts + '</div></fieldset>';
    }).join('');
    return '<section class="card"><h2><span class="num">0' + (i + 1) + '</span><span>' + esc(d[sec.sec]) + '</span></h2>' + qs + '</section>';
  }).join('');
}

function read() {
  const v = {};
  S.forEach(sec => sec.qs.forEach(q => { v[q.id] = new FormData(f).getAll(q.id); }));
  return v;
}
function restore(v) {
  for (const [k, vals] of Object.entries(v)) {
    const el = f.elements[k];
    if (!el) continue;
    if (el instanceof RadioNodeList || el.type === 'checkbox' || el.type === 'radio') {
      (el instanceof RadioNodeList ? [...el] : [el]).forEach(x => { x.checked = vals.includes(x.value); });
    } else el.value = vals[0] || '';
  }
}

function render() {
  const d = T[lang], keep = read();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = d[el.dataset.t]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  build();
  restore(keep);
  status.textContent = '';
}

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('h2o-lang', lang); } catch (e) {}
  render();
}));

f.addEventListener('change', e => {
  const q = S.flatMap(s => s.qs).find(x => x.id === e.target.name);
  if (q && q.max && read()[q.id].length > q.max) { e.target.checked = false; status.innerHTML = '<span class="err">' + T[lang].max + '</span>'; }
});
f.addEventListener('input', () => { try { localStorage.setItem(KEY, JSON.stringify(read())); } catch (e) {} });

function summary() {
  const d = T[lang], v = read();
  const all = S.flatMap(s => s.qs);
  if (all.some(q => q.req && !(v[q.id][0] || '').trim())) { status.innerHTML = '<span class="err">' + d.req + '</span>'; return null; }
  return all.map((q, i) => {
    const vals = v[q.id].filter(x => x.trim());
    const ans = q.opts ? vals.map(k => optLabel(d, k)[0]).join(', ') : vals.join('');
    return (i + 1) + '. ' + d[q.id][0] + '\n→ ' + (ans || '-');
  }).join('\n\n');
}
f.addEventListener('submit', e => {
  e.preventDefault();
  const s = summary(); if (!s) return;
  location.href = 'mailto:' + TO + '?subject=' + encodeURIComponent(T[lang].subject) + '&body=' + encodeURIComponent(s);
  status.textContent = T[lang].sent;
});
document.getElementById('copy').addEventListener('click', async () => {
  const s = summary(); if (!s) return;
  try { await navigator.clipboard.writeText(T[lang].subject + '\n\n' + s); status.textContent = T[lang].copied; }
  catch (e) { status.textContent = s; }
});

render();
try { restore(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
</script>
</body>
</html>
